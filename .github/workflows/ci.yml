name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.1
  WASM_PACK_VERSION: 0.13.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Core, WASM, and Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Install Ngspice
        run: sudo apt-get update && sudo apt-get install --yes ngspice

      - name: Install browser runtime
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Run repository verification
        shell: pwsh
        run: ./scripts/verify.ps1
