[package]
name = "kessetsu-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Deterministic circuit DSL, simulation, schematic and EDA export core"
license = "AGPL-3.0-only"
repository = "https://github.com/Stapimaz/Kessetsu"
homepage = "https://kessetsu.com/"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kess"
path = "src/bin/kess.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
wasm-bindgen = "=0.2.126"
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10"
resvg = "=0.45.1"
svg2pdf = "=0.13.0"
