[package]
name = "netlang-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "netlang"
path = "src/bin/netlang.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
wasm-bindgen = "0.2"
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10"
